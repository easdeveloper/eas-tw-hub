<!doctype html><meta charset="utf-8"><title>Attack preparation tests</title><pre id="result">running</pre>
<button id="troop_template_all" type="button">Todas as tropas</button><form id="command-data-form"><input name="input"><input name="axe" data-all-count="100"><input name="ram" data-all-count="20"><input name="catapult" data-all-count="10"><input name="snob" data-all-count="2"></form>
<script>
let now=2000000000000;history.replaceState({},'',location.pathname+'?screen=place&village=9');window.game_data={world:'br-test',player:{id:7,name:'Tester'},village:{id:9},units:['axe','ram','catapult','snob']};
window.EAS={AttackPreparation:{},World:{getWorldName:()=>game_data.world,getPlayer:()=>game_data.player,getServerNowTimestamp:()=>now},Utils:{escapeHtml:(value)=>String(value),parseCoordinate:(value)=>/^\d{1,3}\|\d{1,3}$/.test(value||'')?{coordinate:value}:null,createServerDateTime:(date,time)=>new Date(`${date}T${time}-03:00`)},Place:{buildPlaceUrl:(id)=>new URL(`${location.origin}${location.pathname}?screen=place&village=${id}`),fillCommandTarget:(coord)=>{document.querySelector('[name="input"]').value=coord;return true;}},ScheduledMissionExecution:{readAvailableTroops:()=>({axe:100,ram:20,catapult:10,snob:2})},MissionScheduler:{createMission:(mission)=>({...mission,id:'mission-1'}),load:()=>({missions:[]}),persist:()=>{}},UI:{loadModule:async()=>({open:()=>{}})}};
</script>
<script src="../services/attack-preparation.js"></script>
<script>
(async()=>{const failures=[];let assertions=0;const equal=(actual,expected,label)=>{assertions++;if(JSON.stringify(actual)!==JSON.stringify(expected))failures.push(`${label}: esperado ${JSON.stringify(expected)}, recebido ${JSON.stringify(actual)}`);};const preparation=EAS.AttackPreparation;localStorage.removeItem(preparation.STORAGE_KEY);
const context={id:'ctx-1',sourceModule:'attack-planner',sourceVillageId:'9',sourceVillageName:'Origem',sourceVillageCoord:'500|500',targetCoord:'501|501',arrivalTimestamp:now+7200000,sendTimestamp:now+3600000,durationSeconds:3600,referenceUnit:'axe',displayTimezone:'Asia/Tokyo',displayJapanTimezone:true,japanTimezoneEnabled:true,createdAt:Date.now()};preparation.save(context);equal(preparation.read().id,'ctx-1','A: contexto salvo por mundo e jogador');
history.replaceState({},'',location.pathname+'?screen=place&village=9&eas_attack_preparation=ctx-1');equal(preparation.getAttackPreparationContextIdFromUrl(),'ctx-1','A2: contexto é detectado pelo parâmetro da URL');
const available=preparation.readAvailableTroops(window);equal(available,{axe:100,ram:20,catapult:10,snob:2},'B: tropas reais lidas da Praça');
equal(preparation.buildFullTroops({available,include:{axe:true,ram:true,snob:false},reserve:{axe:10,ram:2,snob:0}}),{axe:90,ram:18,catapult:0,snob:0},'C: FULL aplica reserva e não inclui nobre automaticamente');
equal(preparation.getTroops({mode:'nt',available,ntUnit:'ram',ntQuantity:5}),{axe:0,ram:5,catapult:0,snob:0},'D: NT simples usa unidade lenta configurada');
equal(preparation.validate({context,mode:'nt',troops:{ram:1},available,sendTime:now+1000,ntUnit:'axe'}).valid,false,'E: NT exige Ariete ou Catapulta');
equal(preparation.validate({context,mode:'custom',troops:{axe:1},available,sendTime:now-1}).reasons.some((reason)=>reason.includes('interpretado como passado')),true,'F: horário passado bloqueia agendamento e explica o motivo');
equal(preparation.initialize(window),true,'G: Praça auto-inicializa preparação');equal(document.querySelectorAll(`#${preparation.PANEL_ID}`).length,1,'H: painel aparece automaticamente');equal(preparation.initialize(window),true,'I: atualização reutiliza preparação');equal(document.querySelectorAll(`#${preparation.PANEL_ID}`).length,1,'J: painel não duplica');
equal(document.getElementById(preparation.PANEL_ID).textContent.includes('Ataque FULL'),true,'K: painel oferece Personalizado, FULL e NT');equal(document.getElementById(preparation.PANEL_ID).textContent.includes('501|501'),true,'L: destino do Planejador chega à Praça');
const modeField=document.querySelector('[data-mode]');modeField.value='custom';modeField.dispatchEvent(new Event('change',{bubbles:true}));const customAxe=document.querySelector('[data-custom="axe"]');customAxe.value='1';customAxe.dispatchEvent(new Event('input',{bubbles:true}));equal(document.querySelector('[data-schedule]').disabled,false,'L2: timestamp futuro habilita agendamento quando os demais dados são válidos');
let templateClicks=0;document.getElementById('troop_template_all').onclick=()=>{templateClicks++;document.querySelector('[name="axe"]').value='100';document.querySelector('[name="ram"]').value='20';};equal(preparation.clickAllTroopsTemplate(window),true,'M: modelo Todas as tropas é localizado por estrutura estável');equal(templateClicks,1,'N: modelo nativo recebe um único clique');equal((await preparation.waitForAllTroopsTemplateApplied({targetWindow:window,available,timeoutMs:1000,intervalMs:10})).applied,true,'O: preenchimento nativo estabiliza antes dos ajustes');
const applied=preparation.applyFullTroopsToForm({targetWindow:window,available,include:{axe:true,ram:false,catapult:true,snob:false},reserve:{axe:10,catapult:3}});equal([applied.axe,applied.ram,applied.catapult,applied.snob],[90,0,7,0],'P: exclusões, reservas e nobre seguro são aplicados');equal([document.querySelector('[name="axe"]').value,document.querySelector('[name="ram"]').value],['90','0'],'Q: valores finais são gravados no formulário real');
const exactServer=preparation.timestampFromFields('2026-08-05','00:13:04',preparation.SERVER_TIME_ZONE);equal(preparation.fieldsForTimestamp(exactServer,preparation.JAPAN_TIME_ZONE),{date:'2026-08-05',time:'12:13:04'},'R: servidor para Japão preserva dia e segundos');const nextDayServer=preparation.timestampFromFields('2026-08-05','18:30:00',preparation.SERVER_TIME_ZONE);equal(preparation.fieldsForTimestamp(nextDayServer,preparation.JAPAN_TIME_ZONE),{date:'2026-08-06',time:'06:30:00'},'S: servidor para Japão muda o dia corretamente');equal(preparation.timestampFromFields('2026-08-06','06:30:00',preparation.JAPAN_TIME_ZONE),nextDayServer,'T: Japão para servidor resolve o mesmo instante');equal(preparation.fieldsForTimestamp(exactServer,preparation.SERVER_TIME_ZONE),{date:'2026-08-05',time:'00:13:04'},'U: nenhuma conversão dupla altera o servidor');const exactContext=preparation.save({...context,sendTimestamp:exactServer,arrivalTimestamp:preparation.timestampFromFields('2026-08-05','01:10:00',preparation.SERVER_TIME_ZONE)});equal(preparation.read().sendTimestamp,exactServer,'V: reload preserva timestamp absoluto');equal(exactContext.durationSeconds,3600,'W: contexto preserva duração sem arredondamento adicional');
document.getElementById('result').textContent=failures.length?`FAIL\n${failures.join('\n')}`:`PASS - ${assertions} assertions`;document.title=failures.length?'FAIL':'PASS';})();
</script>
