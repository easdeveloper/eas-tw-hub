<!doctype html><meta charset="utf-8"><title>Dashboard tests</title><pre id="result">running</pre>
<script>window.onerror=(message,source,line,column,error)=>{document.getElementById('result').textContent=`ERROR ${message}\n${error?.stack||''}`;document.title='FAIL';};window.EAS={name:'EAS TW Hub',version:'test',UI:{},Modules:{},Utils:{escapeHtml:(value)=>String(value)},World:{getGameData:()=>({})},Villages:{list:()=>[]}};</script>
<script src="../core/ui.js"></script>
<script>
(async()=>{const failures=[];let assertions=0;const equal=(actual,expected,label)=>{assertions+=1;if(JSON.stringify(actual)!==JSON.stringify(expected))failures.push(`${label}: esperado ${JSON.stringify(expected)}, recebido ${JSON.stringify(actual)}`);};
localStorage.setItem('eas_tw_scheduler',JSON.stringify({missions:[{status:'upcoming'},{status:'submitting'},{status:'completed'}]}));EAS.UI.openMainWindow();const categories=[...document.querySelectorAll('.hub-category-title')].map((node)=>node.textContent);equal(categories,['Operações','Mercado','Inteligência','Sistema'],'categorias na ordem solicitada');const operationTitles=[...document.querySelectorAll('.hub-category')[0].querySelectorAll('.hub-tool-card-title')].map((node)=>node.textContent);equal(operationTitles,['Planejador de Ataques','Missões Agendadas','Planejador de Apoios','Farm em Massa','Gerenciador de Fakes'],'operações na ordem solicitada');const marketTitles=[...document.querySelectorAll('.hub-category')[1].querySelectorAll('.hub-tool-card-title')].map((node)=>node.textContent);equal(marketTitles,['Ofertas Inteligentes','Balanceamento','Envio Coordenado'],'mercado na ordem solicitada');equal(document.querySelectorAll('.hub-tool-card-status--em-desenvolvimento').length,6,'seis ferramentas em desenvolvimento');equal([...document.querySelectorAll('.hub-tool-card-badge')].some((node)=>node.textContent==='2 aguardando'),true,'badge de missões aguardando');localStorage.setItem('eas_tw_scheduler',JSON.stringify({missions:[{status:'sent'},{status:'completed'}]}));equal(EAS.UI.refreshDashboardIndicator('scheduled-missions'),true,'badge existente pode ser atualizado');equal(document.querySelector('[data-eas-module="scheduled-missions"] .hub-tool-card-badge'),null,'missões concluídas removem badge de aguardando');
equal(operationTitles.includes('Fake Anti-Snipe'),false,'Anti-Snipe não aparece como card independente');equal(document.querySelector('.hub-dashboard-subtitle').textContent,'Central de operações, economia e inteligência.','subtítulo do painel');equal(document.querySelectorAll('.hub-category-tools').length,4,'cada categoria possui grade própria');
document.getElementById('result').textContent=failures.length?`FAIL\n${failures.join('\n')}`:`PASS — ${assertions} assertions`;document.title=failures.length?'FAIL':'PASS';})();
</script>
