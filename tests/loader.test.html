<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Loader tests</title><pre id="result">running</pre>
<a id="shortcut">Junta tudo</a><script>window.EAS_TW_LOADER_AUTOSTART=false;</script><script src="../loader.js"></script>
<script>
(async()=>{const failures=[];let assertions=0;const equal=(actual,expected,label)=>{assertions++;if(JSON.stringify(actual)!==JSON.stringify(expected))failures.push(`${label}: esperado ${JSON.stringify(expected)}, recebido ${JSON.stringify(actual)}`);};const loader=EASTWHubLoader;equal(document.getElementById('shortcut').textContent,'Junta tudo','nome do atalho pode ser diferente');
const reset=()=>{delete window.EASTWHubLoaderRuntime;document.getElementById(loader.PANEL_ID)?.remove();document.getElementById('eas-tw-hub-root')?.remove();};
reset();let loads=0;const successful=loader.start({loadScript:async()=>{loads++;queueMicrotask(()=>dispatchEvent(new CustomEvent('eas-tw-hub-ready',{detail:{version:'test',mobile:true}})));},initTimeoutMs:100});equal((await successful).version,'test','script e handshake com sucesso');
reset();let networkCode='';try{await loader.start({loadScript:async()=>{throw Object.assign(new Error('rede'),{code:'SCRIPT_LOAD_ERROR'});},initTimeoutMs:20});}catch(error){networkCode=error.code;}equal(networkCode,'SCRIPT_LOAD_ERROR','falha de rede capturada');
let timeoutCode='';const originalAppend=document.head.appendChild.bind(document.head);document.head.appendChild=()=>{};try{await loader.loadRemoteScript('never.js',{timeoutMs:5,createScript:()=>document.createElement('script')});}catch(error){timeoutCode=error.code;}document.head.appendChild=originalAppend;equal(timeoutCode,'SCRIPT_LOAD_TIMEOUT','timeout controlado');
let initTimeout='';try{await loader.waitForReady(5);}catch(error){initTimeout=error.code;}equal(initTimeout,'HUB_INIT_TIMEOUT','arquivo sem handshake');
let initError='';const wait=loader.waitForReady(50);dispatchEvent(new CustomEvent('eas-tw-hub-error',{detail:{message:'falhou'}}));try{await wait;}catch(error){initError=error.code;}equal(initError,'HUB_INIT_ERROR','erro de inicialização capturado');
reset();let resolveLoad;const pendingLoad=()=>new Promise((resolve)=>{loads++;resolveLoad=resolve;});const first=loader.start({loadScript:pendingLoad,initTimeoutMs:100});const second=loader.start({loadScript:pendingLoad,initTimeoutMs:100});equal(first===second||window.EASTWHubLoaderRuntime.status==='loading',true,'inicialização duplicada reutiliza runtime');queueMicrotask(()=>dispatchEvent(new CustomEvent('eas-tw-hub-ready',{detail:{version:'dup'}})));resolveLoad();await first;
const panel=loader.ensurePanel();equal(panel.parentElement===document.body,true,'fallback sem container desktop');equal(panel.style.width.includes('100vw'),true,'painel limitado à viewport móvel');const data=loader.diagnostic('failed','MOBILE_DOM_ERROR','teste');equal([data.diagnosticVersion,data.code,typeof data.mobile],[1,'MOBILE_DOM_ERROR','boolean'],'diagnóstico amigável completo');let copied='';Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:async(value)=>{copied=value;}}});equal(await loader.copyDiagnostic(data,panel),true,'copiar diagnóstico');equal(copied.includes('MOBILE_DOM_ERROR'),true,'JSON copiado');
document.getElementById('result').textContent=failures.length?`FAIL\n${failures.join('\n')}`:`PASS — ${assertions} assertions`;document.title=failures.length?'FAIL':'PASS';})();
</script>
