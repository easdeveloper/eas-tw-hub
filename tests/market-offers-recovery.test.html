<!doctype html><meta charset="utf-8"><title>running</title><pre id="result">running</pre>
<script>
let marketVillage={villageId:'9',available:true,updatedAt:Date.now(),resources:{wood:999999,stone:999999,iron:999999},merchants:{available:20,total:20},activeOfferList:[]},optimisticMutations=0;
const structuredLogs=[];window.game_data={world:'br-test',player:{id:7},village:{id:9}};
window.EAS={MarketOffersExecution:{},Data:{Market:{getById:()=>marketVillage,getAll:()=>[marketVillage],refresh:async()=>marketVillage}},Log:{info:(module,action,data)=>structuredLogs.push({module,action,data}),warn:(module,action,data)=>structuredLogs.push({module,action,data}),error:(module,action,error,data)=>structuredLogs.push({module,action,error:error.message,data})},Utils:{escapeHtml:String},World:{getWorldName:()=>game_data.world},UI:{getDashboardIndicator:()=>''},MarketEngine:{calculateMerchantsRequired:()=>1,getAvailableResources:v=>v.resources,applyCreatedOfferToCache:()=>{optimisticMutations++;return marketVillage},refreshCurrentMarketVillageFromPage:()=>marketVillage,refreshMarketVillage:async()=>marketVillage,parseMarketVillageDocument:()=>({activeOfferList:marketVillage.activeOfferList,merchants:marketVillage.merchants}),getCache:()=>({}),cacheVillages:()=>[marketVillage]}};
</script><script src="../core/utils.js"></script><script src="../services/market-offers-execution.js"></script><script>
(async()=>{const failures=[];let assertions=0;const equal=(actual,expected,label)=>{assertions++;if(JSON.stringify(actual)!==JSON.stringify(expected))failures.push(`${label}: esperado ${JSON.stringify(expected)}, recebido ${JSON.stringify(actual)}`)};const api=EAS.MarketOffersExecution;
equal(api.offerActionState({item:{status:'prepared'},preparedSubmit:true}),['create','skip','back'],'prepared mostra somente ações normais');
equal(api.offerActionState({item:{status:'stale-data'}}),['prepare','skip','back'],'stale mostra Preparar novamente');
equal(api.offerActionState({item:{status:'error',retrySafe:true}}),['retry','skip','back'],'erro recuperável mostra Tentar novamente');
equal(api.offerActionState({item:{status:'submitting'}}),['back'],'submitting não oferece ação duplicável');
equal(api.offerActionState({item:{status:'reconciling'}}),['back'],'reconciling não oferece ação duplicável');
const foundItem=api.normalizeItem({id:'found',villageId:'9',offerResource:'wood',requestResource:'iron',offerAmount:1000,requestAmount:1000,repeatCount:2,maxTravelHours:15,status:'submitting',beforeMatchingQuantity:0});const foundContext={version:api.EXECUTION_VERSION,executionId:'reconcile-found',currentIndex:0,queue:[foundItem]};marketVillage.activeOfferList=[{offerId:'real-1',offerResource:'wood',requestResource:'iron',offerAmount:1000,requestAmount:1000,repeatCount:2,maxTravelTime:15}];api.save(foundContext);const found=await api.reconcileUncertainOffer({context:foundContext,item:foundItem,targetWindow:window});equal([found.found,found.retrySafe,found.result.evidence],[true,false,'reconciled-market-state'],'rescan encontrado impede repetição');
api.finishSuccess(foundContext,foundItem,found.result,window);equal([foundItem.status,optimisticMutations],['created',0],'sucesso reconciliado não aplica mutação otimista duplicada');
const missingItem=api.normalizeItem({id:'missing',villageId:'9',offerResource:'wood',requestResource:'iron',offerAmount:1000,requestAmount:1000,repeatCount:1,status:'submitting',beforeMatchingQuantity:0});const missingContext={version:api.EXECUTION_VERSION,executionId:'reconcile-missing',currentIndex:0,queue:[missingItem]};marketVillage.activeOfferList=[];api.save(missingContext);const missing=await api.reconcileUncertainOffer({context:missingContext,item:missingItem,targetWindow:window});equal([missing.found,missing.retrySafe,missingItem.status],[false,true,'error'],'ausência confirmada libera retry seguro');
equal(api.MAX_AUTOMATIC_RETRIES,1,'retry automático é centralizado e limitado');
const previous={id:'done',villageId:'9',status:'created',diagnosticEvents:[{event:'created'}]},next=api.normalizeItem({id:'next',villageId:'10',villageName:'Aldeia 10',offerResource:'wood',requestResource:'iron',offerAmount:1000,requestAmount:1000,status:'pending'}),advanceContext={version:api.EXECUTION_VERSION,executionId:'advance',currentIndex:1,queue:[previous,next]};api.save(advanceContext);let navigationAttempts=0;const recovered=await api.recoverAdvance({context:advanceContext,previousItem:previous,nextItem:next,targetWindow:window,render:()=>{},navigate:()=>{navigationAttempts++;if(navigationAttempts===1)throw new Error('falha transitória')}});equal([recovered.state,recovered.attemptCount,navigationAttempts],['recovered',2,2],'avanço recupera após reidratar estado');
const failedNext={...next,id:'failed-next',status:'pending'},failedContext={version:api.EXECUTION_VERSION,executionId:'advance-failed',currentIndex:1,queue:[previous,failedNext]};api.save(failedContext);const failed=await api.recoverAdvance({context:failedContext,previousItem:previous,nextItem:failedNext,targetWindow:window,render:()=>{},navigate:()=>{throw new Error('falha permanente')}});equal([failed.state,failed.attemptCount,api.read().queue[1].retrySafe],['failed',2,false],'falha de avanço não libera repetição mutável');
equal(structuredLogs.some(entry=>entry.module==='market.smartOffers'&&entry.action==='advance.failed'),true,'falha de avanço gera log estruturado');equal(structuredLogs.some(entry=>entry.action==='offer.reconcile.found')&&structuredLogs.some(entry=>entry.action==='offer.reconcile.notFound'),true,'reconciliation gera logs estruturados');
document.getElementById('result').textContent=failures.length?`FAIL\n${failures.join('\n')}`:`PASS — ${assertions} assertions`;document.title=failures.length?'FAIL':'PASS';})();
</script>
