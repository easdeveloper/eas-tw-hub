<!doctype html><html><head><meta charset="utf-8"><title>Official auto-minting adapter tests</title></head><body><pre id="result">running</pre>
<script>window.EAS={Adapters:{},Selectors:{},World:{getGameData:()=>({player:{id:1},village:{id:99}})}};</script>
<script src="../core/observability.js"></script>
<script src="../services/minting-adapter.js"></script>
<script>
(async()=>{
 const failures=[];let assertions=0;
 const equal=(actual,expected,label)=>{assertions++;if(JSON.stringify(actual)!==JSON.stringify(expected))failures.push(label+': '+JSON.stringify(actual));};
 try {
  const off=await(await fetch('fixtures/minting/auto-off.html')).text(), on=await(await fetch('fixtures/minting/auto-on.html')).text();
  const origin=location.origin,url=new URL('/game.php?village=13186&screen=snob',origin), doc=html=>new DOMParser().parseFromString(html,'text/html');
  const adapter=EAS.Adapters.Minting, parse=html=>adapter.parsePage(doc(html),url,'13186');
  equal(parse(off).state,'AVAILABLE','OFF official action'); equal(parse(on).state,'ACTIVE','ON official action');
  equal(parse(on).endTime,null,'no fragile text time parser');
  equal(parse(off.replace('name="h"','name="other"')).reason,'NO_H_FIELD','missing h');
  equal(parse(off.replace('synthetic-off-token','')).reason,'NO_H_FIELD','empty h');
  equal(parse(off.replace('method="post"','method="get"')).reason,'INVALID_METHOD','invalid method');
  equal(parse(off.replace('start_auto_minting_session','coin')).reason,'INVALID_ACTION','direct coin never eligible');
  equal(parse(off.replace('13186','999')).reason,'INVALID_ACTION','wrong village');
  equal(parse(off.replace('/game.php?', 'https://other.invalid/game.php?')).reason,'INVALID_ACTION','cross origin');
  equal(parse(off.replace('screen=snob','screen=overview')).reason,'INVALID_ACTION','wrong screen');
  equal(parse(off.replace('action=start_auto_minting_session','action=start_auto_minting_session&amp;action=coin')).reason,'INVALID_ACTION','ambiguous action');
  equal(parse('<div id="content_value">Ativar</div>').state,'UNAVAILABLE','missing table');
  equal(parse('<table class="auto-minting"><tr><td>Ativar Cancelar</td></tr></table>').state,'UNAVAILABLE','text does not imply state');
  equal(parse('<form id="login"><input type="password"></form>').state,'SESSION_INVALID','login');
  equal(parse(off+on).reason,'MULTIPLE_TABLES','ambiguous tables');
  equal(parse(off.replace('</form>','<input name="h" value="synthetic-second"></form>')).reason,'INVALID_H_FIELD','duplicate h');
  equal(parse(off.replace('name="h"','disabled name="h"')).reason,'INVALID_H_FIELD','disabled h');
  equal(parse(off.replace('name="h"','form="other" name="h"')+'<form id="other"></form>').reason,'INVALID_H_FIELD','wrong form owner');
  equal(parse(off.replace('</form>','<input name="count" value="1"></form>')).reason,'UNSUPPORTED_FIELDS','unexpected payload fails closed');
  equal(parse(off.replace('class="btn btn-default"','disabled class="btn btn-default"')).state,'UNAVAILABLE','disabled activation');
  equal(parse(off).diagnostics.selectedHHasValue,true,'safe presence boolean');
  equal(JSON.stringify(parse(off).diagnostics).includes('synthetic-off-token'),false,'token absent from diagnostics');
  const mock=(options={})=>{
   let gets=0,posts=0;const calls=[],logs=[];
   const instance=adapter.createAdapter({origin,gameData:()=>({player:{id:1},village:{id:99}}),onDiagnostic:d=>logs.push(d),fetchPage:async(href,opts)=>{
    const target=new URL(href),post=opts.method==='POST';calls.push({href,opts});if(post)posts++;else gets++;
    if(post && options.throwPost)throw new Error('synthetic-network-secret');
    const html=post?off:gets===1?(options.first||off):posts?(options.final||on):(options.fresh||off);
    target.searchParams.delete('action');
    return {ok:!post||!options.failPost,status:post&&options.failPost?500:200,url:target.href,redirected:post,headers:new Headers({'content-type':'text/html; charset=utf-8'}),text:async()=>html.replaceAll('synthetic-off-token','synthetic-get-'+gets)};
   }});
   return {instance,calls,logs,get posts(){return posts;}};
  };
  let m=mock(); const preview=await m.instance.inspectVillage({id:13186,name:'A'});
  equal(preview.state,'AVAILABLE','preview'); equal(m.posts,0,'preview no POST');
  equal(Object.keys(preview).sort(),['endTime','reason','state','villageId','villageName'],'no token retained in preview');
  const success=await m.instance.activateVillage({villageId:'13186'});
  equal([success.state,success.outcome],['ACTIVE','ACTIVATED'],'fresh final state confirms');
  equal(m.calls.map(c=>c.opts.method||'GET'),['GET','GET','POST','GET'],'fresh GET before POST and final GET');
  equal(new URLSearchParams(m.calls[2].opts.body).get('h'),'synthetic-get-2','preview token never reused');
  equal([...new URLSearchParams(m.calls[2].opts.body).keys()],['h'],'only official payload h');
  equal(new URL(m.calls[2].href).searchParams.get('action'),'start_auto_minting_session','official activation action');
  equal(m.calls.every(c=>new URL(c.href).searchParams.get('village')==='13186'),true,'current screen/village irrelevant');
  equal(JSON.stringify(m.logs).includes('synthetic-get'),false,'logs sanitized');
  m=mock({first:on}); equal((await m.instance.activateVillage({villageId:13186})).state,'ACTIVE','already ACTIVE skipped');equal(m.posts,0,'ACTIVE never POST');
  m=mock({fresh:on});await m.instance.inspectVillage({id:13186});await m.instance.activateVillage({villageId:13186});equal(m.posts,0,'became ACTIVE since preview skipped');
  m=mock({final:off});equal((await m.instance.activateVillage({villageId:13186})).outcome,'UNCERTAIN','200 and unchanged OFF uncertain');equal(m.posts,1,'uncertain no retry');
  m=mock({failPost:true});equal((await m.instance.activateVillage({villageId:13186})).outcome,'UNCERTAIN','HTTP error uncertain');equal(m.posts,1,'HTTP error no retry');
  m=mock({throwPost:true});equal((await m.instance.activateVillage({villageId:13186})).outcome,'UNCERTAIN','network error uncertain');equal(m.posts,1,'network error no retry');
  m=mock();await m.instance.activateVillage({villageId:13186},{beforePost:()=>false});equal(m.posts,0,'claim rejected no POST');
  // Diagnostic-only GET: h exists elsewhere but not in the selected official form.
  const diagnosticHTML = '<div id="gold_overview"></div><input type="hidden" name="h" value="synthetic-outside-secret">'
   + '<table class="auto-minting"><tr><td><input type="hidden" name="h" value="synthetic-table-secret">'
   + '<form method="post" action="/game.php?village=13186&amp;screen=snob&amp;action=start_auto_minting_session&amp;h=synthetic-url-secret"><button>Ativar</button><input name="count" value="synthetic-count-secret"></form>'
   + '<form method="post" action="/game.php?village=13186&amp;screen=snob&amp;action=other"><button>synthetic-button-secret</button><input type="hidden" name="other" value="synthetic-hidden-secret"></form></td></tr></table>';
  let diagnosticReport, diagnosticRequests=0, sanitizedCalls=0;
  const nativeSanitizer=EAS.Log.sanitizeUrl;
  EAS.Log.sanitizeUrl=value=>{sanitizedCalls++;return nativeSanitizer(value);};
  try {
   const diagnosticAdapter=adapter.createAdapter({onDiagnostic:detail=>{diagnosticReport=detail;},fetchPage:async(href,opts)=>{
    diagnosticRequests++;equal(opts.method||'GET','GET','diagnostic never requests POST');
    return {url:href+'&h=synthetic-final-secret',ok:true,status:200,redirected:true,headers:new Headers({'content-type':'text/html; secret=synthetic-header-secret'}),text:async()=>diagnosticHTML};
   }});
   const inspected=await diagnosticAdapter.inspectVillage({id:13186});
   equal(inspected.reason,'NO_H_FIELD','diagnostics do not weaken missing h');
   equal(diagnosticRequests,1,'one GET only');equal(sanitizedCalls,2,'requested and final URL use shared sanitizer');
   equal(diagnosticReport.hCounts,{document:2,autoMintingTable:1,selectedForm:0},'three h count levels');
   equal([diagnosticReport.totalForms,diagnosticReport.autoMintingForms,diagnosticReport.forms.length],[2,2,2],'all table forms reported');
   equal([diagnosticReport.startAutoMintingCandidates,diagnosticReport.cancelAutoMintingCandidates],[1,0],'candidate counts');
   equal([diagnosticReport.status,diagnosticReport.ok,diagnosticReport.redirected,diagnosticReport.contentType],[200,true,true,'text/html'],'transport metadata');
   equal(diagnosticReport.responseLength,diagnosticHTML.length,'response character count without HTML');
   equal([diagnosticReport.hasGoldOverview,diagnosticReport.hasAutoMintingTable],[true,true],'structural markers');
   equal([diagnosticReport.selectedState,diagnosticReport.selectedFormMethod,diagnosticReport.selectedFormHasH],['PARSE_FAILED','POST',false],'actual parser selection');
   equal(diagnosticReport.forms[0].fieldNames,['count'],'names only');equal(diagnosticReport.forms[0].hasCount,true,'count presence');
   equal(diagnosticReport.forms.map(form=>form.buttonTexts),[['Ativar'],['[redacted-text]']],'unknown button text redacted');
   equal(JSON.stringify(diagnosticReport).includes('synthetic-'),false,'all synthetic secrets excluded');
   equal(JSON.stringify(diagnosticReport).includes('<'),false,'no HTML in report');
   equal(diagnosticReport.requestedUrl,new URL('/game.php?screen=snob&village=13186',origin).href,'requested URL sanitized');
   equal(diagnosticReport.finalUrl,diagnosticReport.requestedUrl,'final URL secret stripped');
  } finally { EAS.Log.sanitizeUrl=nativeSanitizer; }
  const originalDebug=console.debug,automatic=[];console.debug=(...args)=>automatic.push(args);
  try {
   const auto=adapter.createAdapter({fetchPage:async href=>({ok:false,status:500,url:href+'&h=synthetic-secret#synthetic-secret',headers:new Headers({'content-type':'text/html; secret=synthetic-secret'})})});
   await auto.inspectVillage({id:13186});
   equal(automatic[0][0],'[EAS Cunhagem Debug] academy GET','automatic diagnostic without Storage');
   equal(JSON.stringify(automatic).includes('synthetic-secret'),false,'URL and header secrets excluded');
  }finally{console.debug=originalDebug;}
 }catch(error){failures.push(error.stack);}
 document.getElementById('result').textContent=failures.length?'FAIL\n'+failures.join('\n'):`PASS — ${assertions} assertions`;
})();
</script></body></html>
