<!doctype html><meta charset="utf-8"><title>Mission Scheduler tests</title><pre id="result">running</pre>
<script>window.EAS={MissionScheduler:{},World:{getWorldName:()=>'br-test',getPlayer:()=>({name:'Tester'})}};</script>
<script src="../services/mission-scheduler.js"></script>
<script src="../modules/scheduled-missions.js"></script>
<script>
(()=>{const failures=[];let assertions=0;const equal=(actual,expected,label)=>{assertions+=1;if(JSON.stringify(actual)!==JSON.stringify(expected))failures.push(`${label}: esperado ${JSON.stringify(expected)}, recebido ${JSON.stringify(actual)}`);};const scheduler=EAS.MissionScheduler;localStorage.removeItem(scheduler.STORAGE_KEY);equal(typeof EAS.Modules.ScheduledMissions.open,'function','painel de missões registrado');
const later=scheduler.createMission({id:'later',type:'attack',villageId:'1',villageName:'A',villageCoord:'500|500',targetCoord:'501|501',sendTime:2000});equal([later.type,later.status,later.world],['attack','created','br-test'],'criar missão normalizada');const earlier=scheduler.createMission({id:'earlier',type:'support',sendTime:1000});equal(scheduler.load().missions.map((mission)=>mission.id),['earlier','later'],'ordenação pelo horário mais próximo');
const edited=scheduler.updateMission('later',{notes:'editada',sendTime:500});equal([edited.notes,scheduler.load().missions[0].id],['editada','later'],'editar e reordenar');equal(scheduler.load().missions.length,2,'persistência no storage');equal(scheduler.deleteMission('earlier'),true,'excluir missão');equal(scheduler.load().missions.map((mission)=>mission.id),['later'],'exclusão persistida');
let intervals=0;const fakeWindow={setInterval:()=>{intervals+=1;return 77;},clearInterval:()=>{},dispatchEvent:()=>{},CustomEvent:function(){}};const first=scheduler.initialize(fakeWindow);const second=scheduler.initialize(fakeWindow);equal([first===second,intervals,first.timer],[true,1,77],'inicialização única e timer único');equal(fakeWindow.EASSchedulerRuntime.currentMission.id,'later','runtime seleciona próxima missão');scheduler.stop(fakeWindow);equal([fakeWindow.EASSchedulerRuntime.initialized,fakeWindow.EASSchedulerRuntime.timer],[false,null],'scheduler pode parar sem executar missão');equal(scheduler.load().missions[0].status,'created','timer não executa nem altera status');
document.getElementById('result').textContent=failures.length?`FAIL\n${failures.join('\n')}`:`PASS — ${assertions} assertions`;document.title=failures.length?'FAIL':'PASS';})();
</script>
