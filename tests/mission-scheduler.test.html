<!doctype html><meta charset="utf-8"><title>Mission Scheduler tests</title><pre id="result">running</pre>
<script>let testWorld='br-test',testPlayer='7',serverNow=100000;window.EAS={MissionScheduler:{},World:{getWorldName:()=>testWorld,getPlayer:()=>({id:testPlayer,name:'Tester'}),getServerNowTimestamp:()=>serverNow}};</script>
<script src="../services/mission-scheduler.js"></script>
<script src="../modules/scheduled-missions.js"></script>
<script>
(()=>{const failures=[];let assertions=0;const equal=(actual,expected,label)=>{assertions+=1;if(JSON.stringify(actual)!==JSON.stringify(expected))failures.push(`${label}: esperado ${JSON.stringify(expected)}, recebido ${JSON.stringify(actual)}`);};const scheduler=EAS.MissionScheduler;localStorage.removeItem(scheduler.STORAGE_KEY);localStorage.removeItem(scheduler.LEGACY_STORAGE_KEY);equal(typeof EAS.Modules.ScheduledMissions.open,'function','painel registrado');
const later=scheduler.createMission({id:'later',type:'attack',villageId:'1',sendTime:2000});equal([later.type,later.status,later.world],['attack','created','br-test'],'criar missão normalizada');const earlier=scheduler.createMission({id:'earlier',type:'support',sendTime:1000});equal(scheduler.load().missions.map((mission)=>mission.id),['earlier','later'],'ordenação por sendTime');const edited=scheduler.updateMission('later',{notes:'editada',sendTime:500});equal([edited.notes,scheduler.load().missions[0].id],['editada','later'],'editar e reordenar');equal(scheduler.deleteMission('earlier'),true,'excluir missão');
let intervals=0;const fakeWindow={setInterval:()=>{intervals+=1;return 77;},clearInterval:()=>{},dispatchEvent:()=>{},CustomEvent:function(){}};const first=scheduler.initialize(fakeWindow),second=scheduler.initialize(fakeWindow);equal([first===second,intervals,first.timer],[true,1,77],'timer global único');scheduler.stop(fakeWindow);equal([fakeWindow.EASSchedulerRuntime.initialized,fakeWindow.EASSchedulerRuntime.timer],[false,null],'scheduler pode parar');
const planned={id:'planned',type:'attack',operationType:'attack-planner',world:'br-test',playerId:'7',villageId:'9',villageName:'Origem',villageCoord:'500|500',targetCoord:'501|501',troops:{axe:10},sendTime:200000,arrivalTime:300000,status:'waiting',sourceModule:'attack-planner'};const created=scheduler.createMission(planned);equal([created.sourceModule,created.arrivalTime,created.troops.axe],['attack-planner',300000,10],'agendar linha válida');equal(scheduler.findDuplicate(planned).id,'planned','detectar duplicada');equal(scheduler.createMission(planned).duplicate.id,'planned','não duplicar silenciosamente');
serverNow=150000;equal(scheduler.formatRemaining(200000),'00:00:50','contagem usa servidor');let prepared=scheduler.updateMission('planned',{status:'prepared'});equal(scheduler.isAttackEnabled(prepared),false,'ataque desabilitado antes da janela');serverNow=195000;prepared=scheduler.load().missions.find((m)=>m.id==='planned');equal(scheduler.isAttackEnabled(prepared),true,'ataque habilitado na janela');serverNow=240001;equal(scheduler.getVisualStatus(prepared),'late','missão atrasada');equal(scheduler.cancelMission('planned').status,'cancelled','cancelamento preservado');
testPlayer='8';equal(scheduler.load().missions.length,0,'separação por jogador');testPlayer='7';equal(scheduler.load().missions.some((m)=>m.id==='planned'),true,'contexto original preservado');scheduler.createMission({...planned,id:'conflict-a',sendTime:500000,status:'waiting'},{replaceDuplicate:true});scheduler.createMission({...planned,id:'conflict-b',villageId:'10',sendTime:508000,status:'waiting'});equal(scheduler.detectMissionConflicts().some((item)=>item.type==='different-villages-close'),true,'conflito de horários próximos');const executing=scheduler.updateMission('conflict-a',{status:'executing'});equal(executing.status==='sent',false,'clique inicial não significa enviado');equal(scheduler.updateMission('conflict-a',{status:'verification-required'}).status,'verification-required','confirmação exige evidência');
document.getElementById('result').textContent=failures.length?`FAIL\n${failures.join('\n')}`:`PASS — ${assertions} assertions`;document.title=failures.length?'FAIL':'PASS';})();
</script>
