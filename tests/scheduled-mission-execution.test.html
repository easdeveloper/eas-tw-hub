<script>
let serverNow=90000,fillCalls=0;window.game_data={world:'br-test',screen:'place',player:{id:7,name:'Tester'},village:{id:9}};history.replaceState({},'',location.pathname+'?screen=place&village=9');window.EAS={MissionScheduler:{},World:{getWorldName:()=>game_data.world,getPlayer:()=>game_data.player,getServerNowTimestamp:()=>serverNow},Utils:{parseCoordinate:(value)=>/^\d{1,3}\|\d{1,3}$/.test(value||'')?{coordinate:value}:null,formatDateTime:(value)=>String(value),escapeHtml:(value)=>String(value)},UI:{loadModule:async()=>({open:()=>{}})},Place:{fillCommandTarget:(coord)=>{fillCalls++;document.querySelector('[name="input"]').value=coord;return true;},buildPlaceUrl:(id)=>new URL(`${location.origin}/game.php?village=${id}&screen=place`)}};

<script src="../services/mission-scheduler.js"></script><script src="../services/scheduled-mission-execution.js"></script>
<script>
(async()=>{const failures=[];let assertions=0;const equal=(actual,expected,label)=>{assertions++;if(JSON.stringify(actual)!==JSON.stringify(expected))failures.push(`${label}: esperado ${JSON.stringify(expected)}, recebido ${JSON.stringify(actual)}`);};localStorage.removeItem(EAS.MissionScheduler.STORAGE_KEY);const mission=EAS.MissionScheduler.createMission({id:'attack-1',type:'attack',world:'br-test',playerId:'7',villageId:'9',villageName:'A',villageCoord:'500|500',targetCoord:'501|501',troops:{axe:10},sendTime:100000,status:'waiting'});
let savedBeforeNavigation=null,navigatedUrl='';const originalOpen=window.open;window.open=(url)=>{navigatedUrl=url;savedBeforeNavigation=EAS.MissionScheduler.load();return {closed:true};};equal(EAS.ScheduledMissionExecution.openAndPrepare(mission),true,'abrir e preparar inicia navegação');window.open=originalOpen;equal([savedBeforeNavigation.activeMissionId,savedBeforeNavigation.preparingMissionId,savedBeforeNavigation.expectedVillageId,savedBeforeNavigation.expectedScreen],['attack-1','attack-1','9','place'],'missão ativa salva antes da navegação');equal(navigatedUrl.includes('screen=place'),true,'navega para a Praça');
equal(await EAS.ScheduledMissionExecution.initialize(),true,'auto-inicialização encontra missão');equal(Boolean(document.getElementById('eas-scheduled-mission-panel')),true,'painel abre automaticamente');equal([EAS.MissionScheduler.load().missions[0].status,document.querySelector('[name="input"]').value,document.querySelector('[name="axe"]').value],['prepared','501|501','10'],'formulário preparado');equal(fillCalls,1,'preparação executada uma vez');equal(await EAS.ScheduledMissionExecution.initialize(),true,'segunda inicialização reutiliza painel');equal(document.querySelectorAll('#eas-scheduled-mission-panel').length,1,'painel não duplica');
EAS.ScheduledMissionExecution.cleanup();delete window.EASScheduledMissionRuntime;document.getElementById('eas-scheduled-mission-panel').remove();equal(await EAS.ScheduledMissionExecution.initialize(),true,'painel reaparece após recarregamento simulado');equal(fillCalls,1,'missão já preparada não preenche novamente');
EAS.ScheduledMissionExecution.cleanup();delete window.EASScheduledMissionRuntime;game_data.village.id=10;history.replaceState({},'',location.pathname+'?screen=place&village=10');document.querySelector('[name="input"]').value='';equal(await EAS.ScheduledMissionExecution.initialize(),true,'aldeia errada ainda abre painel');equal(document.getElementById('eas-scheduled-mission-panel').textContent.includes('outra aldeia'),true,'aviso de aldeia errada');equal(document.querySelector('[name="input"]').value,'','aldeia errada não preenche formulário');
game_data.village.id=9;history.replaceState({},'',location.pathname+'?screen=place&village=9');let timeoutMessage='';const form=document.getElementById('command-data-form');form.remove();try{await EAS.ScheduledMissionExecution.waitForRallyPointForm({timeoutMs:20,intervalMs:5});}catch(error){timeoutMessage=error.message;}equal(timeoutMessage.includes('não ficou pronta'),true,'espera limitada pelo formulário');document.body.appendChild(form);
EAS.MissionScheduler.cancelMission('attack-1');EAS.ScheduledMissionExecution.cleanup();delete window.EASScheduledMissionRuntime;document.getElementById('eas-scheduled-mission-panel')?.remove();equal(await EAS.ScheduledMissionExecution.initialize(),false,'missão cancelada não reabre painel');equal(EAS.MissionScheduler.load().activeMissionId,null,'cancelamento limpa missão ativa');const state=EAS.MissionScheduler.load();state.activeMissionId=null;state.preparingMissionId=null;EAS.MissionScheduler.persist(state);equal(await EAS.ScheduledMissionExecution.initialize(),false,'sem missão ativa não altera página');
document.getElementById('result').textContent=failures.length?`FAIL\n${failures.join('\n')}`:`PASS — ${assertions} assertions`;document.title=failures.length?'FAIL':'PASS';})();
</script>
