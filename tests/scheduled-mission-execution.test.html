<!doctype html><meta charset="utf-8"><title>Scheduled mission execution tests</title><pre id="result">running</pre>
<form id="command-data-form"><input name="input"><input id="unit_input_axe" name="axe" data-all-count="20"><button id="target_attack" type="button">Atacar</button></form>
<script>
let serverNow=90000;window.game_data={world:'br-test',player:{id:7,name:'Tester'},village:{id:9}};window.EAS={MissionScheduler:{},World:{getWorldName:()=>game_data.world,getPlayer:()=>game_data.player,getServerNowTimestamp:()=>serverNow},Utils:{parseCoordinate:(value)=>/^\d{1,3}\|\d{1,3}$/.test(value||'')?{coordinate:value}:null,formatDateTime:(value)=>String(value),escapeHtml:(value)=>String(value)},Place:{fillCommandTarget:(coord)=>{document.querySelector('[name="input"]').value=coord;return true;}}};
</script>
<script src="../services/mission-scheduler.js"></script><script src="../services/scheduled-mission-execution.js"></script>
<script>
(async()=>{const failures=[];let assertions=0;const equal=(actual,expected,label)=>{assertions++;if(JSON.stringify(actual)!==JSON.stringify(expected))failures.push(`${label}: esperado ${JSON.stringify(expected)}, recebido ${JSON.stringify(actual)}`);};localStorage.removeItem(EAS.MissionScheduler.STORAGE_KEY);const mission=EAS.MissionScheduler.createMission({id:'attack-1',type:'attack',world:'br-test',playerId:'7',villageId:'9',villageName:'A',villageCoord:'500|500',targetCoord:'501|501',troops:{axe:10},sendTime:100000,status:'waiting'});equal(await EAS.ScheduledMissionExecution.prepare(mission),true,'preparar missão válida');equal(EAS.MissionScheduler.load().missions[0].status,'prepared','status preparado');equal(EAS.ScheduledMissionExecution.runtimeFor().preparedMissionId,'attack-1','preparação única por missão');document.querySelector('#unit_input_axe').dataset.allCount='5';EAS.ScheduledMissionExecution.runtimeFor().preparedMissionId=null;equal((await EAS.ScheduledMissionExecution.prepare({...mission,id:'attack-2'})),false,'tropas insuficientes bloqueiam preparação');document.querySelector('#unit_input_axe').dataset.allCount='20';const prepared=EAS.MissionScheduler.load().missions.find((m)=>m.id==='attack-1');equal(EAS.MissionScheduler.isAttackEnabled(prepared),true,'botão habilita na janela');const clicked=EAS.MissionScheduler.updateMission('attack-1',{status:'executing'});equal(clicked.status,'executing','clique não marca sent');location.hash='confirmation';equal(EAS.ScheduledMissionExecution.detectEvidence(window,clicked),null,'sem evidência não confirma envio');document.body.append(' comando foi enviado ');equal(EAS.ScheduledMissionExecution.detectEvidence(window,clicked),'sent','evidência real confirma envio');document.getElementById('result').textContent=failures.length?`FAIL\n${failures.join('\n')}`:`PASS — ${assertions} assertions`;document.title=failures.length?'FAIL':'PASS';})();
</script>
