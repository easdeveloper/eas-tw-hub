<!doctype html><meta charset="utf-8"><title>running</title><pre id="result">running</pre>
<form id="command-confirm-form"><p>Destino (484|527)</p><input type="hidden" name="source_village" value="10"><span data-unit="axe" data-count="1">1</span><button id="troop_confirm_submit" type="submit">Enviar ataque</button></form>
<script>
let now=950000, clicks=0; const pending=[];
window.EAS={Selectors:{},Adapters:{},World:{getWorldName:()=> 'tactical-browser',getPlayer:()=>({id:1})},Utils:{parseCoordinate:c=>({coordinate:c})},MassSnipeExecution:{getCurrentServerTimeMs:()=>now}};
window.game_data={world:'tactical-browser',player:{id:1},village:{id:10,x:500,y:500}};
window.Timing={getCurrentServerTime:()=>now};
document.querySelector('form').onsubmit=e=>e.preventDefault();
document.querySelector('button').onclick=()=>clicks++;
</script>
<script src="../services/fakes-execution.js"></script><script src="../services/mass-snipe-precise.js"></script><script src="../services/arrival-execution.js"></script><script src="../services/tactical-operation-scheduler-adapter.js"></script>
<script>
(async()=>{
 if(document.readyState!=='complete') await new Promise(resolve=>window.addEventListener('load',resolve,{once:true}));
 const failures=[];let assertions=0;const check=(x,m)=>{assertions++;if(!x)failures.push(m);};
 const api=EAS.TacticalOperationSchedulerAdapter;
 const outgoing=document.createElement('table');outgoing.id='commands_outgoings';document.body.append(outgoing);
 const incoming=document.createElement('table');incoming.innerHTML='<tbody><tr class="command-row"><td class="quickedit-in" data-id="999">Incoming</td></tr></tbody>';document.body.append(incoming);
 const row=(id,type,source='10')=>`<tr class="command-row"><td><span class="quickedit-out" data-id="${id}"><span class="quickedit-label">Command (484|527)</span></span><a href="https://br143.tribalwars.com.br/game.php?screen=info_command&type=own&village=${source}&id=${id}">Details</a><span data-command-id="${id}" data-command-type="${type}"></span></td><td>00:16:50.001</td></tr>`;
 EAS.MassSnipeExecution.parseArrival=()=>({});EAS.MassSnipeExecution.getLandingTime=()=>1010001;
 for(const commandType of ['attack','support']) {
 clicks=0;pending.length=0;now=950000;
 document.querySelector('button').textContent=commandType==='attack'?'Enviar ataque':'Enviar apoio';
 outgoing.innerHTML='<tbody>'+row('7','unknown')+'</tbody>';
 localStorage.removeItem(api.STORAGE_KEY);
 const cmd={slotId:'one',parentSlotId:'one',source:{id:'10',coord:'500|500'},target:{coord:'484|527'},commandType,composition:{quantities:{axe:1}},sendAtMs:1000000,desiredArrivalMs:1010000,travelTimeMs:10000,validationStatus:'ready',blockers:[]};
 const queue=api.enqueue({snapshotKind:'tactical-approved-operation',version:1,operationId:'browser-'+Date.now(),revision:1,validation:{valid:true},commands:[cmd]},{createdAt:1});
 const eid=queue.execution.executionId,uid=queue.execution.units[0].executionUnitId;
 const read=()=>api.list()[0].units[0],save=u=>api.updateStoredUnit(eid,uid,u);
 let unit=api.authorizeStoredUnit(eid,uid,{authorizedAt:1});
 unit=save(api.advancePrecheck10m(unit,{now:500000,sessionAvailable:true,accountValid:true,loggedIn:true,source:cmd.source,target:cmd.target}));

 const w={document,location:{href:'https://br143.tribalwars.com.br/game.php?screen=place&village=10'},EAS,game_data,Timing,localStorage,crypto,performance:{now:()=>now},navigator,
  addEventListener:(...a)=>window.addEventListener(...a),removeEventListener:(...a)=>window.removeEventListener(...a),setTimeout:fn=>{pending.push(fn);return pending.length;},clearTimeout:()=>{}};
 check(!EAS.FakesExecution.readOutgoingCommands(w).available,'shared inventory rejects mixed or unclassified rows');
 now=800000;check(api.captureExecutionBaseline(unit,w).valid,'real DOM baseline adapter captured');unit=read();check(unit.outgoingBaseline.commandIds.includes('7'),'unknown old own ID retained in baseline');
 unit=save(api.advancePrepare5m(unit,{now,sourceCorrect:true,targetCorrect:true,compositionMatches:true,confirmationContextValid:true}));
 now=950000;unit=save(api.advanceSync2m(unit,{now,source:'Timing.getCurrentServerTime+World.getServerDateTime',samples:[0,1,2].map(i=>({serverNowMs:now-i,localNowMs:now-i,measuredAt:now-i}))}));
 unit=save(api.advanceFinalCheck(unit,{now,authorizationValid:true,sessionTrusted:true,sourceCorrect:true,targetCorrect:true,commandTypeCorrect:true,compositionMatches:true,confirmationContextValid:true,clockEvidenceFresh:true,singleSubmitControlFound:true}));
 w.location.href+='&try=confirm';
 check((await api.armFinalExecution(eid,uid,w,{dryRun:false})).armed===false,'preflight cannot send');
 check((await api.armFinalExecution(eid,uid,w,{dryRun:true})).armed,'dry run armed with browser Web Lock');
 now=1000000;pending.splice(0).forEach(fn=>fn());check(clicks===0,'dry run never clicks real DOM button');
 await new Promise(r=>setTimeout(r,0));now=950000;
 check(Boolean(api.authorizeFinalSubmit(eid,uid,w)),'explicit final authorization');
 check((await api.armFinalExecution(eid,uid,w,{dryRun:false})).armed,'real mock armed');
 check(!(await api.armFinalExecution(eid,uid,w,{dryRun:false})).armed,'duplicate arm blocked');
 now=1000000;const callbacks=pending.splice(0);callbacks.forEach(fn=>fn());callbacks.forEach(fn=>fn());
 check(clicks===1,'one final DOM click despite duplicate callback');check(read().state==='UNCERTAIN','click alone never proves success');
 check(!(await api.armFinalExecution(eid,uid,w,{dryRun:false})).armed,'uncertain never resends');
 w.location.href=w.location.href.replace('&try=confirm','');
 check(api.recoverFinalExecution(eid,uid,w)?.state==='UNCERTAIN','old inventory alone never proves success');
 outgoing.innerHTML='<tbody>'+row('7','unknown')+row('99','unknown')+'</tbody>';
 check(api.recoverFinalExecution(eid,uid,w)?.state==='UNCERTAIN','new unclassified command remains uncertain');
 outgoing.innerHTML='<tbody>'+row('7','unknown')+row('99',commandType,'11')+'</tbody>';
 check(api.recoverFinalExecution(eid,uid,w)?.state==='UNCERTAIN','wrong source never proves success');
 outgoing.innerHTML='<tbody>'+row('7','unknown')+row('99',commandType)+'</tbody>';
 check(api.recoverFinalExecution(eid,uid,w)?.state==='COMPLETED','new real ID plus arrival proof completes');
 const timing=document.createElement('tr');timing.innerHTML='<td>Duration</td><td data-duration="10000">00:00:10</td>';document.querySelector('form').append(timing);
 const secret=document.createElement('input');secret.name='h';secret.value='csrf-secret';document.querySelector('form').append(secret);
 const diagnostic=api.nativeTimingDiagnostic(w);
 check(diagnostic.fields.some(f=>f.times.includes('00:00:10')),'diagnostic extracts actual timing text');
 check(diagnostic.nativeSubmitAtMs===null&&!diagnostic.timingProven,'duration alone never invents native timing');
 check(!JSON.stringify(diagnostic).includes('csrf-secret'),'diagnostic excludes token');
 }
 document.title=failures.length?'FAIL':'PASS';document.getElementById('result').textContent=failures.length?failures.join('\n'):`PASS - ${assertions} assertions`;
})().catch(e=>{document.title='FAIL';document.getElementById('result').textContent=e.stack;});
</script>
