<!doctype html><meta charset="utf-8"><title>running</title><pre id="result">running</pre>
<script>
let now = Date.now(), clockAnchor = now, clockOffset = 0, missionCreates = 0, legacyInitializes = 0, openedUrl = null, submitClicks = 0;
const setServerNow = value => { now = value; clockAnchor = Date.now(); clockOffset = now - clockAnchor; };
window.game_data = { world: 'br-test', player: { id: 7 }, village: { id: 10, x: 500, y: 500 } };
window.Timing = { getCurrentServerTime: () => Date.now() + clockOffset };
window.EAS = {
  Modules: {},
  World: { getWorldName: () => 'br-test', getPlayer: () => ({ id: 7 }), getServerNowTimestamp: () => now + (Date.now() - clockAnchor), getServerDateTime: () => ({ available: true }) },
  Utils: { formatDateTime: value => String(value), parseCoordinate: value => { const match = /^(\d{1,3})\|(\d{1,3})$/.exec(String(value || '')); return match ? { coordinate: `${Number(match[1])}|${Number(match[2])}` } : null; }, escapeHtml: value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) },
  MassSnipeExecution: { getCurrentServerTimeMs: () => now + (Date.now() - clockAnchor) },
  Place: {
    buildPlaceUrl: id => { const url = new URL(location.href); url.search = ''; url.searchParams.set('screen', 'place'); url.searchParams.set('village', id); return url; },
    getCommandForm: doc => doc.querySelector('#command-data-form, #command-confirm-form'),
    getTargetInput: doc => doc.querySelector('input[name="input"]'), inspectTargetInputs: doc => { const input = doc.querySelector('input[name="input"]'); return { input, blocker: input ? null : 'TARGET_INPUT_NOT_FOUND', candidates: [] }; },
    fillCommandTarget: (coord, targetWindow) => { const field = targetWindow.document.querySelector('input[name="input"]'); if (!field) return false; field.value = coord; return true; },
    readCommandTarget: targetWindow => ({ actualTarget: targetWindow.document.querySelector('input[name="input"]')?.value || null })
  },
  MissionScheduler: {
    initialize: () => { legacyInitializes += 1; }, load: () => ({ missions: [], settings: {}, logs: [] }),
    getServerNow: () => new Date(now), sortMissions: values => values, detectMissionConflicts: () => [],
    getVisualStatus: () => 'waiting', formatRemaining: () => '-', createMission: () => { missionCreates += 1; throw new Error('Legacy Scheduler mission creation forbidden'); }
  },
  ScheduledMissionExecution: { openAndPrepare: () => { throw new Error('Legacy execution forbidden'); }, initialize: () => { throw new Error('Legacy execution forbidden'); } },
  UI: {
    createWindow: () => { const body = document.createElement('div'); document.body.append(body); return { body, close: () => body.remove() }; },
    createButton: ({ text, onClick }) => { const button = document.createElement('button'); button.textContent = text; button.onclick = onClick; return button; },
    openMainWindow: () => {}
  }
};
window.EASLoader = { loadScript: async () => {} };
window.open = url => { openedUrl = String(url); return { focus() {} }; };
</script>
<script src="../services/tactical-operation-scheduler-adapter.js"></script>
<script src="../modules/scheduled-missions.js"></script>
<script>
(async () => {
 const failures=[];let assertions=0;
 const check=(value,message)=>{assertions++;if(!value)failures.push(message);};
 if(document.readyState==='loading')await new Promise(resolve=>document.addEventListener('DOMContentLoaded',resolve,{once:true}));
 const api=EAS.TacticalOperationSchedulerAdapter;
 localStorage.removeItem(api.STORAGE_KEY);
 setServerNow(100000);
 EAS.MassSnipeExecution.getCurrentServerTimeMs=()=>100000.875;
 const cmd={slotId:'attack',parentSlotId:'attack',source:{id:'10',coord:'516|458'},target:{coord:'507|471'},commandType:'support',composition:{quantities:{axe:5930,light:3117}},sendAtMs:1000000,desiredArrivalMs:1010000,travelTimeMs:10000,validationStatus:'ready',blockers:[]};
 const queued=api.enqueue({snapshotKind:'tactical-approved-operation',version:1,operationId:'br143',revision:1,target:cmd.target,validation:{valid:true},commands:[cmd]},{createdAt:1});
 const read=()=>api.list()[0].units[0];
 check(!read().preparationAuthorization,'authorization initially absent');
 let win=await EAS.Modules.ScheduledMissions.open();
 await new Promise(r=>setTimeout(r,0));
 const card=()=>win.body.querySelector('[data-tactical-unit]');
 check(card().querySelector('[data-tactical-authorize]'),'initial actionable button');
 const group=card().closest('details');group.open=true;
 card().querySelector('[data-tactical-authorize]').click();
 await new Promise(r=>setTimeout(r,0));
 check(api.preparationAuthorizationValid(read()),'fractional real-clock authorization persisted');
 check(read().preparationAuthorization.authorizedAt===100000,'audit timestamp normalized only');
 check(!card().querySelector('[data-tactical-authorize]'),'rerender removes actionable authorization');
 check(card().querySelector('[data-tactical-authorized]')?.disabled,'authorized state is explicit and disabled');
 check(card().querySelector('[data-tactical-authorization]').textContent.includes('AUTORIZADA'),'card exposes persisted status');
 check(card().closest('details').open,'authorization rerender preserves expansion');
 check(win.body.querySelector('[data-tactical-feedback]').textContent.includes('persistida'),'feedback survives rerender');
 card().closest('details').open=false;card().closest('details').open=true;
 check(api.preparationAuthorizationValid(read()),'collapse expand preserves permission');
 window.dispatchEvent(new CustomEvent('eas:scheduler-tick',{detail:{now:100000}}));
 check(read().state==='SCHEDULED'&&read().nextCheckpoint==='PRECHECK_10M','no early lifecycle advance');
 const persisted=api.createStore(localStorage).read().executions['br-test:7'][0].units[0];
 check(api.preparationAuthorizationValid(persisted),'reconstructed persisted authorization');
 win.close();win=await EAS.Modules.ScheduledMissions.open();await new Promise(r=>setTimeout(r,0));
 check(!card().querySelector('[data-tactical-authorize]')&&card().querySelector('[data-tactical-authorized]').disabled,'closing reopening retains authorization UI');
 let copied=null;Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:async text=>{copied=JSON.parse(text);}}});
 [...win.body.querySelectorAll('button')].find(b=>b.textContent==='Copiar diagn\u00f3stico').click();
 await new Promise(r=>setTimeout(r,0));
 const diag=copied?.tactical?.executions[0]?.units[0];
 check(diag?.executionUnitId===read().executionUnitId,'clipboard includes Tactical unit');
 check(diag?.preflightAuthorization.valid&&!diag?.finalSubmitAuthorization.present,'clipboard distinguishes permissions');
 check(diag?.source.coord==='516|458'&&diag?.target.coord==='507|471','clipboard identity');
 check(diag?.state==='SCHEDULED'&&diag?.attempt.present===false,'clipboard stage and attempt');
 check(!read().finalAuthorization&&missionCreates===0&&submitClicks===0&&copied.missions.length===0,'no final permission, mission or submit');
 document.title=failures.length?'FAIL':'PASS';document.getElementById('result').textContent=failures.length?failures.join('\n'):`PASS - ${assertions} assertions`;
})().catch(e=>{document.title='FAIL';document.getElementById('result').textContent=e.stack;});
</script>
