<!doctype html><meta charset="utf-8"><title>Userscript loader tests</title><pre id="result">running</pre>
<script>
window.unsafeWindow=window;let bundleRequests=0;const originalAppend=document.head.appendChild.bind(document.head);document.head.appendChild=(node)=>{if(node.matches?.('script[data-eas-userscript-bundle]')){bundleRequests++;queueMicrotask(()=>{node.onload?.();dispatchEvent(new CustomEvent('eas-tw-hub-ready',{detail:{version:'test'}}));});return node;}return originalAppend(node);};
</script>
<script src="../eas-tw-loader.user.js"></script>
<script>
(async()=>{const failures=[];let assertions=0;const equal=(actual,expected,label)=>{assertions++;if(JSON.stringify(actual)!==JSON.stringify(expected))failures.push(`${label}: esperado ${JSON.stringify(expected)}, recebido ${JSON.stringify(actual)}`);};await new Promise((resolve)=>setTimeout(resolve,0));equal(bundleRequests,1,'bundle oficial solicitado uma vez');equal([window.__EAS_TW_BOOTSTRAPPED__,window.__EAS_TW_INITIALIZING__,window.__EAS_TW_SILENT_BOOTSTRAP__],[true,false,true],'travas globais refletem bootstrap silencioso concluído');EASTWUserscriptLoader.start();equal(bundleRequests,1,'segunda inicialização não reinjeta bundle');equal(EASTWUserscriptLoader.bundleUrl,'https://easdeveloper.github.io/eas-tw-hub/index.js','somente URL oficial é aceita');const diagnostic=EASTWUserscriptLoader.pageContext();equal([diagnostic.loaderVersion,diagnostic.bootstrapState.bootstrapped,diagnostic.url===location.href],['0.1.0',true,true],'diagnóstico expõe versão, URL e estado');equal(document.getElementById('eas-tw-loader-resume-error'),null,'sem erro não cria aviso nem menu');document.getElementById('result').textContent=failures.length?`FAIL\n${failures.join('\n')}`:`PASS — ${assertions} assertions`;document.title=failures.length?'FAIL':'PASS';})();
</script>
